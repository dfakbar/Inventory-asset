services:
  # PHP-FPM (aplikasi Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventory-asset:latest
    container_name: inventory-asset-app
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./storage/app/public:/var/www/storage/app/public   # arsip PDF/ upload (persist)
    env_file: .env
    environment:
      DB_HOST: db                 # override DB_HOST di .env → hostname service db
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy

  # Web server — DocumentRoot ke /var/www/public
  nginx:
    image: nginx:1.27-alpine
    container_name: inventory-asset-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Database MySQL 8
  db:
    image: mysql:8.0
    container_name: inventory-asset-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-inventoryasset_kbn}
      MYSQL_USER: ${DB_USERNAME:-inventoryasset}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD di .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Queue worker (notifikasi email mutasi)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-asset-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy

  # Scheduler (logs:purge harian)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-asset-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
